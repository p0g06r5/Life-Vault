name: Verify Live Login Integration
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify private homepage redirects instead of throwing error 1101
        shell: bash
        run: |
          set -euo pipefail
          URL=https://life-vault-c3b.pages.dev/
          for attempt in $(seq 1 12); do
            CODE=$(curl -sS --max-time 15 -o /tmp/lv-private.html -D /tmp/lv-private.headers -w '%{http_code}' "$URL" || true)
            if [ "$CODE" = "302" ] && grep -Eiq '^location: https://life-vault-c3b.pages.dev/login' /tmp/lv-private.headers; then
              echo "CONFIRMED: unauthenticated homepage redirects to login (302), no Worker exception."
              exit 0
            fi
            echo "Attempt $attempt: expected 302 to login, got $CODE"
            sleep 8
          done
          echo 'Private homepage has not recovered; inspect Pages runtime logs' >&2
          exit 1
      - name: Verify new collection and résumé screens reached production
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://life-vault-c3b.pages.dev
          for attempt in $(seq 1 18); do
            curl -fsSL --max-time 20 "$BASE/login" -o /tmp/lv-current.html
            ASSET=$(grep -oE '/assets/index-[^" ]+\.js' /tmp/lv-current.html | head -1 || true)
            if [ -n "$ASSET" ] && curl -fsSL --max-time 25 "$BASE$ASSET" -o /tmp/lv-current.js; then
              if grep -Fq 'Drop your photographs here' /tmp/lv-current.js && grep -Fq 'Drop your résumé here' /tmp/lv-current.js; then
                echo 'CONFIRMED: Collection Studio and Résumé Studio are present on production Pages.'
                exit 0
              fi
            fi
            echo "New studio screens not deployed yet, retry $attempt"
            sleep 8
          done
          echo 'Could not confirm current frontend bundle reached Cloudflare Pages.' >&2
          exit 1
      - name: Check login route and Pages service binding
        shell: bash
        run: |
          set -euo pipefail
          PAGE=https://life-vault-c3b.pages.dev
          curl --fail --silent --show-error --max-time 15 "$PAGE/login" -o /tmp/lv-login.html
          grep -qi 'LifeVault' /tmp/lv-login.html
          for attempt in $(seq 1 12); do
            CODE=$(curl --silent --show-error --max-time 15 -o /tmp/lv-user.json -w '%{http_code}' "$PAGE/api/v1/auth/me" || true)
            if [ "$CODE" = "401" ] && jq -e '.user == null' /tmp/lv-user.json; then
              echo "CONFIRMED: Frontend login route and authenticated API proxy are connected."
              exit 0
            fi
            echo "Attempt $attempt: API status $CODE. Expected 401 before sign-in."
            cat /tmp/lv-user.json 2>/dev/null || true
            sleep 8
          done
          echo "Cloudflare Pages still needs Service binding BACKEND_API -> life-vault-backend under Settings > Bindings, followed by redeploy." >&2
          exit 1
